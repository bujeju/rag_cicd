# main 에 병합되면 실행:
#   테스트/평가 → 이미지 빌드 & GHCR push → dev 자동 배포 → (승인 후) prod 배포
#
# 필요한 설정 (GitHub 저장소 Settings)
#   Secrets  : KUBE_CONFIG     = kubeconfig 파일을 base64 로 인코딩한 값
#              OPENAI_API_KEY  = (선택) 없으면 fake 모드
#   Variables: DEV_HOST, PROD_HOST = (선택) Ingress 도메인. 없으면 Ingress 생략
#   Environments: "production" 만들고 Required reviewers 에 짝 지정 → prod 승인 단계
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/build_index.py
      - run: pytest -q
      - run: python eval/run_eval.py

  build-and-push:
    needs: test-and-eval
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: 이미지 이름 결정 (태그 = 커밋 해시 앞 7자리)
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${REPO}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: APP_VERSION=${{ github.sha }}

  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: kubeconfig 설정
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          kubectl cluster-info
      - name: dev 배포
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bash scripts/deploy.sh dev "${{ needs.build-and-push.outputs.image }}" "${{ vars.DEV_HOST }}"

  deploy-prod:
    needs: [build-and-push, deploy-dev]
    runs-on: ubuntu-latest
    environment: production          # 여기서 승인 대기 (짝이 승인)
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: kubeconfig 설정
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
      - name: prod 배포
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bash scripts/deploy.sh prod "${{ needs.build-and-push.outputs.image }}" "${{ vars.PROD_HOST }}"
