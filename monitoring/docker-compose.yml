# 로컬에서 앱 + Prometheus + Grafana 를 한 번에 띄운다
#   cd monitoring
#   docker compose up -d --build
#   앱:        http://localhost:8000/docs
#   Prometheus: http://localhost:9090   (Status → Targets 에서 UP 확인)
#   Grafana:    http://localhost:3000   (admin / admin → LLMOps 폴더 → RAG LLMOps)
#   종료:       docker compose down
services:
  rag-app:
    build:
      context: ..
      args:
        APP_VERSION: local-compose
    ports: ["8000:8000"]
    environment:
      LLM_PROVIDER: fake

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
